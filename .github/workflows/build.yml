name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: npm install
      - run: npx cap add android
      - name: Icon and splash
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0d12' --splashBackgroundColor '#0b0d12'
      - run: bash scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk F1-Drift.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest F1-Drift.apk --title "F1 Drift APK" --notes "Latest build ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: F1-Drift-apk, path: F1-Drift.apk }
