name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['tools/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          sed -i "s/__VERSION__/${{ github.run_number }}/" www/js/updater.js
          echo "VER=${{ github.run_number }}" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: npm install
      - run: npx cap add android
      - name: Icon and splash
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0d12' --splashBackgroundColor '#0b0d12'
      - run: bash scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: OTA bundle
        run: cd www && zip -qr ../bundle.zip . -x '*.map'
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk F1-Drift.apk
          SHA=$(sha256sum bundle.zip | cut -d' ' -f1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest F1-Drift.apk bundle.zip --title "F1 Drift v${{ github.run_number }}" --notes "v${{ github.run_number }} · ${{ github.sha }} · sha256=$SHA"
      - uses: actions/upload-artifact@v4
        with: { name: F1-Drift-apk, path: F1-Drift.apk }
